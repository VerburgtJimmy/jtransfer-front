<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tessil - Send anything. We see nothing.</title>
    <meta
      name="description"
      content="End-to-end encrypted file transfer. Your browser encrypts before upload, so we never see your files or the key."
    />
    <meta name="robots" content="index, follow" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fafaf7"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0e0f12"
    />
    <meta name="referrer" content="no-referrer" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Switzer-Variable.woff2"
      crossorigin
    />
    <meta property="og:site_name" content="Tessil" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Tessil - Send anything. We see nothing."
    />
    <meta
      property="og:description"
      content="End-to-end encrypted file transfer. Your browser encrypts before upload, so we never see your files or the key."
    />
    <meta property="og:image" content="https://tessil.app/og-image.png" />
    <meta property="og:url" content="https://tessil.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Tessil - Send anything. We see nothing."
    />
    <meta
      name="twitter:description"
      content="End-to-end encrypted file transfer. Your browser encrypts before upload, so we never see your files or the key."
    />
    <meta name="twitter:image" content="https://tessil.app/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="/head.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap" class="bg-background text-foreground">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
